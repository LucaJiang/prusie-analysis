name: manuscript-reproduction
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  level-a:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r environment/requirements-level-a.txt
      - run: make check
      - run: make figures
